name: Sync from talent-supply-hub-public

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-from-public
  cancel-in-progress: true

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source and published content updates
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          echo "efe315cde5df208bb34dcc268f39e90b21de69ad32c9ba39b96856186ea20973  release-content-20261124.zip" | sha256sum --check
          unzip -q release-content-20261124.zip -d "$tmpdir/release"
          git clone --depth=1 https://github.com/shiyuecheng34-hue/talent-supply-hub-public.git "$tmpdir/source"
          rsync -a --delete --exclude ".git" --exclude ".github/workflows/sync-from-public.yml" --exclude "release-content-20261124.zip" "$tmpdir/source/" ./
          rsync -a "$tmpdir/release/source/" ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "同步达人团双旦IP与节点导出规则"
            git push origin HEAD:main
          fi

  sync-pages:
    needs: sync-main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish updated Pages with cached avatars
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          echo "efe315cde5df208bb34dcc268f39e90b21de69ad32c9ba39b96856186ea20973  release-content-20261124.zip" | sha256sum --check
          unzip -q release-content-20261124.zip -d "$tmpdir/release"
          git clone --depth=1 --branch gh-pages https://github.com/shiyuecheng34-hue/talent-supply-hub-public.git "$tmpdir/source"
          git clone --depth=1 https://github.com/shiyuecheng34-hue/talent-supply-hub-public.git "$tmpdir/source-main"
          rsync -a "$tmpdir/release/source/" "$tmpdir/source-main/"
          rm -f "$tmpdir/source"/static/js/async/page.* "$tmpdir/source"/static/js/main.* "$tmpdir/source"/static/js/625.*
          rsync -a "$tmpdir/release/pages/" "$tmpdir/source/"
          git fetch origin gh-pages:gh-pages
          git worktree add "$tmpdir/target" gh-pages
          mkdir -p "$tmpdir/cache/avatars"
          cd "$tmpdir/target"
          if [ -d avatars ]; then cp -a avatars/. "$tmpdir/cache/avatars/"; fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --delete --exclude ".git" "$tmpdir/source/" ./
          touch .nojekyll
          mkdir -p avatars
          cp -a "$tmpdir/cache/avatars/." avatars/
          python3 "$tmpdir/source-main/scripts/prepare_public_release.py" --dist "$tmpdir/target" --source-dir "$tmpdir/source-main/src/data"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "发布双旦海报等高布局与达人团更新"
            git push origin HEAD:gh-pages
          fi
