name: Sync from talent-supply-hub-public

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-from-public
  cancel-in-progress: true

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source and published content updates
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          echo "6a6a9b7f79d8082f4394963730c7e5a65ca1e74b42ffb088d781237e91cdff6d  release-content-20261124.zip" | sha256sum --check
          unzip -q release-content-20261124.zip -d "$tmpdir/release"
          echo "696098a241adc6914a69cafbb19597875de9b7d7d824d853ddc88989defcbb07  release-ip-winter-20261124.zip" | sha256sum --check
          rm -f "$tmpdir/release"/pages/static/js/async/page.*
          unzip -qo release-ip-winter-20261124.zip -d "$tmpdir/release"
          echo "6cf754c74c0edb3ffc7c03e28736a586ef4697ade95a447dbecd6e19130b4db9  release-performance-20261124.zip" | sha256sum --check
          rm -f "$tmpdir/release"/pages/static/js/async/page.*
          unzip -qo release-performance-20261124.zip -d "$tmpdir/release"
          echo "02516d8354cde65edd95a7ed6b9646fdd0ff12fa707fc72fc4e68a3ded755f37  release-education-20261124.zip" | sha256sum --check
          rm -f "$tmpdir/release"/pages/static/js/async/page.*
          unzip -qo release-education-20261124.zip -d "$tmpdir/release"
          echo "ad154bd92ddef4a61c3147f68b07c481248fc2acac88281921bafc00503ef3bb  release-agency-resilience-20261125.zip" | sha256sum --check
          rm -f "$tmpdir/release"/pages/static/js/async/page.*
          unzip -qo release-agency-resilience-20261125.zip -d "$tmpdir/release"
          git clone --depth=1 https://github.com/shiyuecheng34-hue/talent-supply-hub-public.git "$tmpdir/source"
          rsync -a --delete --exclude ".git" --exclude ".github/workflows/sync-from-public.yml" --exclude "release-content-20261124.zip" --exclude "release-ip-winter-20261124.zip" --exclude "release-performance-20261124.zip" --exclude "release-education-20261124.zip" --exclude "release-agency-resilience-20261125.zip" "$tmpdir/source/" ./
          rsync -a "$tmpdir/release/source/" ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "同步达人团双旦IP与节点导出规则"
            git push origin HEAD:main
          fi

  sync-pages:
    needs: sync-main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish updated Pages with cached avatars
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          echo "6a6a9b7f79d8082f4394963730c7e5a65ca1e74b42ffb088d781237e91cdff6d  release-content-20261124.zip" | sha256sum --check
          unzip -q release-content-20261124.zip -d "$tmpdir/release"
          echo "696098a241adc6914a69cafbb19597875de9b7d7d824d853ddc88989defcbb07  release-ip-winter-20261124.zip" | sha256sum --check
          rm -f "$tmpdir/release"/pages/static/js/async/page.*
          unzip -qo release-ip-winter-20261124.zip -d "$tmpdir/release"
          echo "6cf754c74c0edb3ffc7c03e28736a586ef4697ade95a447dbecd6e19130b4db9  release-performance-20261124.zip" | sha256sum --check
          rm -f "$tmpdir/release"/pages/static/js/async/page.*
          unzip -qo release-performance-20261124.zip -d "$tmpdir/release"
          echo "02516d8354cde65edd95a7ed6b9646fdd0ff12fa707fc72fc4e68a3ded755f37  release-education-20261124.zip" | sha256sum --check
          rm -f "$tmpdir/release"/pages/static/js/async/page.*
          unzip -qo release-education-20261124.zip -d "$tmpdir/release"
          echo "ad154bd92ddef4a61c3147f68b07c481248fc2acac88281921bafc00503ef3bb  release-agency-resilience-20261125.zip" | sha256sum --check
          rm -f "$tmpdir/release"/pages/static/js/async/page.*
          unzip -qo release-agency-resilience-20261125.zip -d "$tmpdir/release"
          git clone --depth=1 --branch gh-pages https://github.com/shiyuecheng34-hue/talent-supply-hub-public.git "$tmpdir/source"
          git clone --depth=1 https://github.com/shiyuecheng34-hue/talent-supply-hub-public.git "$tmpdir/source-main"
          rsync -a "$tmpdir/release/source/" "$tmpdir/source-main/"
          rm -f "$tmpdir/source"/static/js/async/page.* "$tmpdir/source"/static/js/main.* "$tmpdir/source"/static/js/625.*
          rsync -a "$tmpdir/release/pages/" "$tmpdir/source/"
          git fetch origin gh-pages:gh-pages
          git worktree add "$tmpdir/target" gh-pages
          mkdir -p "$tmpdir/cache/avatars"
          cd "$tmpdir/target"
          if [ -d avatars ]; then cp -a avatars/. "$tmpdir/cache/avatars/"; fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --delete --exclude ".git" "$tmpdir/source/" ./
          touch .nojekyll
          mkdir -p avatars
          cp -a "$tmpdir/cache/avatars/." avatars/
          python3 "$tmpdir/source-main/scripts/prepare_public_release.py" --dist "$tmpdir/target" --source-dir "$tmpdir/source-main/src/data"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "发布双旦海报等高布局与达人团更新"
            git push origin HEAD:gh-pages
          fi
