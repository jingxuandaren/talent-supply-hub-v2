name: Deploy GitHub Pages Runner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-runner
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm from npmjs
        run: npm i -g pnpm@12.16.1 --registry=https://registry.npmjs.org
      - name: Install dependencies
        env:
          npm_config_registry: https://bnpm.byted.org/
        run: pnpm install --frozen-lockfile
      - name: Build GitHub Pages bundle
        env:
          npm_config_registry: https://bnpm.byted.org/
        run: pnpm run build:github-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4













































